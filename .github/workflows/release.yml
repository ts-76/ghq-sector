name: Release

# Publication is intentionally disabled pending an audited npm publisher.
# This workflow can verify main and maintain release PRs, but cannot create
# tags/GitHub releases or publish packages. Restore publication in a reviewed PR.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-pr:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install audited release tooling
        run: bun install --frozen-lockfile
      - name: Audit release tooling
        run: bun audit --audit-level=moderate && npm audit --audit-level=moderate
      - name: Update release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-control.mjs pr

  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install UI dependencies
        run: bun install --cwd ui --frozen-lockfile
      - name: Audit application, UI, and release tooling
        run: bun run audit
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: |
          bun run typecheck
          bun run --cwd ui typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Check package tarball
        run: bun run pack:check
