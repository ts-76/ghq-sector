name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install audited release tooling
        run: bun install --frozen-lockfile
      - name: Audit release tooling
        run: bun audit --audit-level=moderate && npm audit --audit-level=moderate
      - name: Update release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-control.mjs pr

  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install UI dependencies
        run: bun install --cwd ui --frozen-lockfile
      - name: Install pinned publish CLI
        run: npm ci --prefix .github/publish-cli --ignore-scripts --no-audit --no-fund
      - name: Audit application, UI, and publish CLI
        run: bun run audit
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: |
          bun run typecheck
          bun run --cwd ui typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Check package without publishing
        run: bun run publish:dry-run

  github-release:
    needs: [release-pr, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install audited release tooling
        run: bun install --frozen-lockfile
      - name: Create release after verification
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-control.mjs release

  publish:
    needs: github-release
    if: needs.github-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.github-release.outputs.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install UI dependencies
        run: bun install --cwd ui --frozen-lockfile
      - name: Install pinned publish CLI
        run: npm ci --prefix .github/publish-cli --ignore-scripts --no-audit --no-fund
      - name: Audit released dependencies and publish CLI
        run: bun run audit
      - name: Check version matches release tag
        env:
          RELEASE_TAG: ${{ needs.github-release.outputs.tag_name }}
        run: node -e 'if (`v${require("./package.json").version}` !== process.env.RELEASE_TAG) process.exit(1)'
      - name: Verify released commit
        run: |
          bun run lint
          bun run typecheck
          bun run --cwd ui typecheck
          bun run test
      - name: Build distributable files
        run: bun run build
      - name: Check package without publishing
        run: bun run publish:dry-run
      - name: Publish with existing trusted publisher
        run: node .github/publish-cli/node_modules/npm/bin/npm-cli.js publish --provenance --access public --ignore-scripts
