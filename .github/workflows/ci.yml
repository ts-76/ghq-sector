name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install UI dependencies
        run: bun install --cwd ui --frozen-lockfile

      - name: Lint
        run: bunx @biomejs/biome ci .

      - name: Typecheck
        run: |
          bun run typecheck
          bun run --cwd ui typecheck

      - name: Check Svelte UI
        run: bun run --cwd ui check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check package tarball
        run: bun run pack:check
